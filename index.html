<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLOW RITUAL</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- Tailwind -->
    <link href="./src/output.css" rel="stylesheet">
</head>


<body>
    <!--------------header------------->
    <header class=" bg-white  sticky top-0  border-b  border-b border-[#eee9e5]  z-50">
        <div class="container ">
            <div class="row justify-between ">
                <!--logo-->
                <a href="#"
                    class="font-semibold font-inter whitespace-nowrap shrink-0 tracking-wide text[48px] text-[#82505B] py-[12px]">GLOW
                    RITUAL</a>

                <nav class=" 
                       py-[29px]
                       hidden
                       lg:flex
                        items-center
                        gap-5
                        font-inter
                        font-semibold
                        text-nav
                        leading-4
                        text-[14px]">
                    <a href="#" class="nav-link">Skincare</a>
                    <a href="#" class="nav-link">Cosmetics</a>
                    <a href="#" class="nav-link">Perfumes</a>
                    <a href="#" class="text-[#82505b] border-b border-[#82505b] pd-1">New Arivales</a>
                    <a href="#" class="nav-link">Best sellers</a>
                    <a href="#" class="nav-link">Rituals</a>
                </nav>
                <!--------icons--------->
                <div class="flex items-center gap-4 xl:gap-6 text-[#82505b] shrink0">
                    <button class="icon-btn hidden sm:block">
                        <img src="./assets/img/icons/searche.svg" alt="this is image the icon searche">
                    </button>
                    <button class="icon-btn hidden sm:block">
                        <img src="./assets/img/icons/hearticoons.svg" alt="this is hert icon">
                    </button>
                    <button class="icon-btn hidden sm:block">
                        <img src="./assets/img/icons/personal.svg" alt="this is the icons prsonal">
                    </button>
                    <button class="icon-btn hidden sm:block">
                        <img src="./assets/img/icons/Shopping-Cart.svg" alt="this is the icon Shopping cart">
                    </button>
                    <!-------------mobile menu------------------->
                    <button class="icon-bt text-secondery lg:hidden text-lg" >
                        <img src="./assets/img/icons/mun.svg" alt="this is mune icons">
                    </button>
                </div>
            </div>
        </div>
    </header>
    <!----------hero section----------->
    <section class=" relative min-h-150 overflow-hidden ">

        <!-- desktop image-->
         <img src="./assets/img/herosiction.jfif" alt="this is background imge" class="hero-image hidden lg:block">
         <!--mobile image-->
         <img src="./assets/img/hero-section-mobile.svg" alt="this is background mobile image" class="hero-image block lg:hidden">
         <!--hero content-->
         <div class=" container relative z-10 max-auto w-full max-w-7xl flex py-[305.5px] items-center justify-start px-[37.5px] ">
            <!--hero text-->
            <div class=" max-w-2xl  w-full text-start">
                <!--small heading-->
                <p class="pb-4 font-inter font-semibold leading-4  tracking-[2.8px] uppercase text-[#795905]">LUMINOUS ESSENTIALS</p>
                <!--main header-->
                <h1 class="whitespace-nowrap font-playfair text-4xl font-bold leading-tight text-secondery  sm:text-5xl md:text-[64px]">Radiance Redefined</h1>
                <!--paragraph-->
                <p class="font-inter text-[18px] leading-7 text-primary">Experience the intersection of advanced skin <br>
science and high-end sensory rituals. Your path to <br>
eternal glow starts here.</p>

            </div>
         </div>
    </section>
</body>

</html>
